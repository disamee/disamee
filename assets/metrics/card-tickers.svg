<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 150" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-tickers" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2324"/>
      <stop offset="100%" stop-color="#071214"/>
    </linearGradient>
    <linearGradient id="accent-tickers" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
  </style>
  <rect width="580" height="150" rx="12" fill="url(#grad-tickers)"/>
  <rect width="578" height="148" x="1" y="1" rx="11" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <path d="M 1 40 L 1 12 Q 1 1 12 1 L 60 1" fill="none" stroke="#10b981" stroke-width="2"/>

  <!-- Icon & Category -->
  <g transform="translate(24, 24)">
    <rect width="36" height="36" rx="8" fill="#062e24" stroke="#10b981" stroke-width="1"/>
    <text x="18" y="24" text-anchor="middle" font-size="18">⚡</text>
    <text x="48" y="14" class="mono" font-size="10.5" font-weight="700" fill="#34d399" letter-spacing="0.08em">REAL-TIME COMMODITY TICKERS</text>
    <text x="48" y="32" class="sans" font-size="13" font-weight="600" fill="#94a3b8">Low-Latency Market Feeds</text>
  </g>

  <!-- Big Metric -->
  <text x="24" y="105" class="sans" font-size="34" font-weight="800" fill="url(#accent-tickers)" letter-spacing="-0.03em">&lt; 100ms Latency</text>

  <!-- Description & Subtext -->
  <text x="24" y="130" class="sans" font-size="12" fill="#94a3b8">Asynchronous WebSocket pub/sub for live grain, currency, and commodity tickers</text>

  <!-- Tech Pill -->
  <g transform="translate(425, 90)">
    <rect width="130" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="65" y="17" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#34d399">FastAPI + WS</text>
  </g>
</svg>
