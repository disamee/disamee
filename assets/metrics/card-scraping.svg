<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 150" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-scraping" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1b0c"/>
      <stop offset="100%" stop-color="#0f0c08"/>
    </linearGradient>
    <linearGradient id="accent-scraping" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
  </style>
  <rect width="580" height="150" rx="12" fill="url(#grad-scraping)"/>
  <rect width="578" height="148" x="1" y="1" rx="11" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <path d="M 1 40 L 1 12 Q 1 1 12 1 L 60 1" fill="none" stroke="#f59e0b" stroke-width="2"/>

  <!-- Icon & Category -->
  <g transform="translate(24, 24)">
    <rect width="36" height="36" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
    <text x="18" y="24" text-anchor="middle" font-size="18">🚂</text>
    <text x="48" y="14" class="mono" font-size="10.5" font-weight="700" fill="#fbbf24" letter-spacing="0.08em">DISTRIBUTED HEADLESS SCRAPERS</text>
    <text x="48" y="32" class="sans" font-size="13" font-weight="600" fill="#94a3b8">Logistics &amp; Shipment Tracking</text>
  </g>

  <!-- Big Metric -->
  <text x="24" y="105" class="sans" font-size="34" font-weight="800" fill="url(#accent-scraping)" letter-spacing="-0.03em">10,000+ / day</text>

  <!-- Description & Subtext -->
  <text x="24" y="130" class="sans" font-size="12" fill="#94a3b8">Distributed Selenium Chrome worker pool processing EPD railway waybills</text>

  <!-- Tech Pill -->
  <g transform="translate(425, 90)">
    <rect width="130" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="65" y="17" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#fbbf24">Selenium Grid</text>
  </g>
</svg>
