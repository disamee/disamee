    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
  </style>
  <rect width="580" height="150" rx="12" fill="url(#grad-prompts)"/>
  <rect width="578" height="148" x="1" y="1" rx="11" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <path d="M 1 40 L 1 12 Q 1 1 12 1 L 60 1" fill="none" stroke="#a855f7" stroke-width="2"/>

  <!-- Icon & Category -->
